<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lesson 19 — Use of Operators</title>
  <style>body{font-family:Arial;padding:18px}pre{background:#f6f8fa;padding:10px}</style>
</head>
<body>
  <h1>Operators</h1>
  <p>Covers arithmetic, comparison, logical, assignment, and ternary operators with examples and pitfalls.</p>

  <div>
    <button id="run">Run operator examples</button>
    <pre id="out"></pre>
  </div>

  <script>
    const out = document.getElementById('out');
    document.getElementById('run').addEventListener('click', ()=>{
      out.textContent = '';
      out.textContent += '1 + 2 = ' + (1+2) + '\n';
      out.textContent += '"5" - 2 = ' + ('5'-2) + ' (type coercion)\n';
      out.textContent += '0 == false -> ' + (0 == false) + '\n';
      out.textContent += '0 === false -> ' + (0 === false) + ' (no type coercion)\n';
      out.textContent += 'null == undefined -> ' + (null == undefined) + '\n';
      out.textContent += 'Ternary: ' + (5 > 3 ? 'yes' : 'no') + '\n';
    });
  </script>
</body>
</html>
