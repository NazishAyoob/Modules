<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson23 — Arrays in JS</title>
<style>body{font-family:Arial;padding:18px}pre{background:#f6f8fa;padding:8px}</style></head>
<body>
  <h1>Arrays in JavaScript</h1>
  <p>Creation, indexing, push/pop, splice, slice and iteration examples.</p>
  <pre id="out"></pre>
  <script>
    const a = [10,20]; a.push(30); const s = a.slice(1); a.splice(1,1);
    document.getElementById('out').textContent = `array=${a}\nslice=${s}`;
  </script>
</body>
</html>
