<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson23 — Methods in Array</title>
<style>body{font-family:Arial;padding:18px}pre{background:#f6f8fa;padding:8px}</style></head>
<body>
  <h1>Array Methods</h1>
  <p>Use <code>map</code>, <code>filter</code>, <code>reduce</code> for expressive data transforms.</p>
  <pre id="out"></pre>
  <script>
    const nums=[1,2,3,4];
    const squares = nums.map(n=>n*n);
    const evens = nums.filter(n=>n%2===0);
    const sum = nums.reduce((s,n)=>s+n,0);
    document.getElementById('out').textContent = `nums=${nums}\nsquares=${squares}\nevens=${evens}\nsum=${sum}`;
  </script>
</body>
</html>
