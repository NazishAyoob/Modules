<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson24 — HTML DOM</title>
<style>body{font-family:Arial;padding:18px}input,button{margin-top:6px}</style></head>
<body>
  <h1>HTML DOM Manipulation</h1>
  <p>Examples of creating, appending, removing, and reading attributes.</p>
  <div id="list"></div>
  <input id="item" placeholder="new item" /> <button id="add">Add</button>
  <script>
    const list = document.getElementById('list');
    document.getElementById('add').addEventListener('click', ()=>{
      const val = document.getElementById('item').value || 'empty';
      const li = document.createElement('div'); li.textContent = val;
      const del = document.createElement('button'); del.textContent = 'x'; del.style.marginLeft='8px';
      del.addEventListener('click', ()=>li.remove());
      li.appendChild(del); list.appendChild(li);
    });
  </script>
</body>
</html>
