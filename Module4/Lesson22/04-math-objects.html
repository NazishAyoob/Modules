<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson22 — Built-in Math Objects</title>
<style>body{font-family:Arial;padding:18px}pre{background:#f6f8fa;padding:8px}</style></head>
<body>
  <h1>Math Object</h1>
  <p>Use <code>Math</code> for constants and functions like <code>Math.PI</code>, <code>Math.random()</code>, <code>Math.round()</code>.</p>
  <pre id="out"></pre>
  <script>
    const o = document.getElementById('out');
    o.textContent = `PI=${Math.PI}\nrandom(0-1)=${Math.random()}\nround(4.6)=${Math.round(4.6)}`;
  </script>
</body>
</html>
