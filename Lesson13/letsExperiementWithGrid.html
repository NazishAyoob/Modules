<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let's Experiment With Grid</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-4">
    <h1>Let's Experiment With Grid</h1>
    <p>Experimenting with different column sizes and responsive breakpoints.</p>
    <div class="row">
      <div class="col-6 col-md-3 bg-info text-dark p-3">col-6 col-md-3</div>
      <div class="col-6 col-md-3 bg-warning text-dark p-3">col-6 col-md-3</div>
      <div class="col-6 col-md-3 bg-light text-dark p-3">col-6 col-md-3</div>
      <div class="col-6 col-md-3 bg-dark text-white p-3">col-6 col-md-3</div>
    </div>
  </div>
</body>
</html>
