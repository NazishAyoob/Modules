<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Headings, Small, DL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-4">
    <h1>Display Headings</h1>
    <h1 class="display-1">Display 1</h1>
    <h1 class="display-4">Display 4</h1>

    <h2>Small Text</h2>
    <p>This is <small>small text</small> inside a paragraph.</p>

    <h2>Description List</h2>
    <dl class="row">
      <dt class="col-sm-3">Term 1</dt>
      <dd class="col-sm-9">Description for the first term.</dd>
      <dt class="col-sm-3">Term 2</dt>
      <dd class="col-sm-9">Description for the second term.</dd>
    </dl>
  </div>
</body>
</html>
