<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Typography</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-4">
    <h1>Bootstrap Typography</h1>
    <p class="lead">This is a lead paragraph styled with Bootstrap.</p>
    <p class="text-muted">Muted text provides supplemental information.</p>
    <p class="text-primary">Primary text uses the theme color.</p>
    <p class="text-decoration-underline">Underlined text example.</p>
  </div>
</body>
</html>
