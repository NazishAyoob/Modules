<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal Scrollspy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body data-bs-spy="scroll" data-bs-target="#navbarExample" data-bs-offset="0" class="scrollspy-example" tabindex="0">
  <nav id="navbarExample" class="navbar navbar-light bg-light px-3 sticky-top">
    <a class="navbar-brand" href="#">Scrollspy</a>
    <ul class="nav nav-pills">
      <li class="nav-item"><a class="nav-link active" href="#section1">Section 1</a></li>
      <li class="nav-item"><a class="nav-link" href="#section2">Section 2</a></li>
      <li class="nav-item"><a class="nav-link" href="#section3">Section 3</a></li>
    </ul>
  </nav>

  <div class="container mt-4">
    <h1>Horizontal Scrollspy</h1>
    <section id="section1" class="my-5">
      <h2>Section 1</h2>
      <p>Scrollspy watches the page and updates the active nav link.</p>
    </section>
    <section id="section2" class="my-5">
      <h2>Section 2</h2>
      <p>This is another section for horizontal scroll navigation.</p>
    </section>
    <section id="section3" class="my-5">
      <h2>Section 3</h2>
      <p>Bootstrap scrollspy links will update as you scroll.</p>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
